<title>윤오의 마크 가이드</title>
<style>
:root{--bg:#f4fbf2;--card:#fff;--ink:#2b2b2b;--sub:#5f6b5c;--grass:#6cc04a;--dirt:#9b6b43;--line:#e3eadf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17201a;--card:#222c25;--ink:#eef3ec;--sub:#a9b8a5;--line:#33403a}}
:root[data-theme="dark"]{--bg:#17201a;--card:#222c25;--ink:#eef3ec;--sub:#a9b8a5;--line:#33403a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",sans-serif}
header{background:linear-gradient(180deg,var(--grass) 0 62%,var(--dirt) 62% 100%);color:#fff;text-align:center;padding:34px 16px 40px}

main{max-width:720px;margin:0 auto;padding:22px 16px;display:grid;gap:16px}
a.go{display:flex;align-items:center;gap:18px;background:var(--card);border:3px solid var(--line);border-bottom-width:7px;border-radius:22px;padding:22px;text-decoration:none;color:var(--ink);min-height:110px}
a.go:active{transform:translateY(3px);border-bottom-width:4px}
.e{font-size:58px;line-height:1}
.t{font-size:28px;font-weight:bold}
.s{font-size:16px;color:var(--sub);margin-top:4px}
.a{border-color:#6cc04a}.b{border-color:#7cc8ff}.c{border-color:#f2b705}
